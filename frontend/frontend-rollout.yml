apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: frontend-rollout
  labels:
    app: my-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: my-app

  template:
    metadata:
      labels:
        app: my-app

    spec:
      containers:
        - name: my-container
          image: ghcr.io/mahi-oops/booking-app:113
          ports:
            - containerPort: 80

  strategy:
    blueGreen:
      activeService: frontend-service
      previewService: frontend-preview
      autoPromotionEnabled: false