apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: my-app
  labels:
    app: backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend-container
          image: ghcr.io/mahi-oops/backend-app:108

          ports:
            - containerPort: 3000

          env:
            - name: DB_HOST
              value: postgres-service

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: "Devops_traveller"

            - name: DB_USER
              value: traveller

            - name: DB_PASSWORD
              value: traveller123