apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: my-app
  labels:
   app: postgres
spec:
  replicas: 1
  selector:
   matchLabels:
     app: postgres
  template:
    metadata:
     labels: 
      app: postgres
    spec:
      nodeSelector:
        kubernates.io/hostname: minikube-m02
      containers:
      - name: postgres
        image: postgres:16
        ports:
         - containerPort: 5432
        envFrom:
          - secretRef:
              name: postgres-secret   
        volumeMounts:
          - name: postgres-storage    
            mountPath: /var/lib/postgresql/data

      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc