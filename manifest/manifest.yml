apiversion: apps/v1
kind: Deployment
metadata:
  name: My_deployment
  labels:
   app: My_app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: My_app
  template:
    metadata:
      labels:
        app: My_app
    spec:
      containers:
      - name: My_container
        image: ghcr.io/mahi-oops/booking-app:52107
        ports: 
         - containerPort: 8080
